# SOCRATES guidelines for data formatting -- machine-readable schema.
#
# This file is the single source of truth for the checker: file names, column
# names, order, types, allowed values, keys, severities and thresholds all live
# here. The choices of the guideline, decided or still open, are listed under
# `decisions` and can be changed by editing the value they point to; pass the
# edited file to the checker with `check_contact_data(path, schema = "<file>")`.
#
# Status: guideline version 1.0 DRAFT. It follows the recommended choices of
# REVIEW_guidelines_vs_flanders2010.md (P1-P11, section 6A.2a/6A.7/6A.8):
# `cnt_id` (legacy alias `cont_id`), `cnt_otherplace`, `part_age_exact`
# (alias `part_age`), survey-day file keyed by `part_id`, no
# `sday_id` in the contact file, TRUE/FALSE booleans (0/1 is an error), UTF-8,
# optional columns may be absent, column order not enforced, no study metadata
# file (socialmixr reads the first .json file of a record as its citation).

schema_format: 1
guideline_version: "1.0"
status: draft
# The reference implementation the guideline was verified against; the checker
# notes when the installed version is older (R22).
reference_implementation:
  socialmixr: "0.7.0"
  contactsurveys: "0.2.0"
title: "SOCRATES guidelines for data formatting, version 1.0 (draft)"
na_token: "NA"

nametag:
  # Recommended form: NAME_YEAR with an optional suffix (P4; the suffix can be the country, a design or a wave). A name
  # that does not follow it is a note (R02, variant not_recommended), not an
  # error. Only a name that cannot serve as a file name prefix is an error
  # (R02): it must match `valid_pattern`. The prefix itself must be the same on
  # every file of the dataset (R01).
  pattern: '^[A-Z0-9]+_[0-9]{4}(_[A-Z0-9]+)*$'
  valid_pattern: '^[A-Za-z0-9]+([_-][A-Za-z0-9]+)*$'
  example: "DOE_2012_BELGIUM"
  # Records published before the recommendation existed may keep their original
  # prefix, e.g. 2010_Willem_BELGIUM: reported as a note (R02, variant
  # legacy_prefix).
  legacy_pattern: '^[0-9]{4}_[A-Za-z0-9]+_[A-Za-z0-9]+(_[A-Za-z0-9]+)*$'

options:
  # `strict`: common-file columns must appear in the guideline order.
  # `ignore`: only presence is checked (socialmixr joins by name). (Q14)
  column_order: ignore
  missing_token_aliases: ["na", "Na", "N/A", "n/a", "NaN", "nan", "null",
                          "NULL", "None", "none", "-", ".", "unknown", "Unknown",
                          "missing", "n.a.", "N.A."]
  placeholder_values: ["-99", "-999", "-9999", "999", "9999"]
  # An age interval with only one bound (e.g. 60+ => est_min = 60, est_max = NA).
  # Guideline (age encoding rules): an open-ended category has est_max = NA and
  # is explained in the dictionary.
  allow_open_age_interval: true
  max_contacts_per_participant: 100
  max_share_zero_contact_participants: 0.3
  max_share_missing_participant_age: 0.05
  max_share_missing_contact_age: 0.5
  # R42: a household larger than this is flagged as implausible (warning; the
  # hard range of hh_size is wider).
  max_plausible_hh_size: 20
  # R44: share of participants without a survey date (sday_id = NA) above which
  # a warning is given (weekday and holiday analyses are impossible for them).
  max_share_missing_sday: 0.05
  # Index-like first column names that indicate exported row names.
  rowname_column_names: ["", "X", "V1", "...1", "Unnamed: 0", "row.names",
                         "rownames", "row_names"]
  # The dictionary in the published record is a spreadsheet (Q16). A CSV
  # dictionary is still read, so that the dictionary checks can run locally,
  # but it is an error in R01 (variant dictionary_format).
  dictionary_extensions: ["xlsx", "xls"]
  dictionary_local_extensions: ["csv"]

types:
  boolean:
    # TRUE/FALSE is the only accepted form. `legacy_values` (integer or quoted
    # 0/1, as in POLYMOD, CoMix and Zenodo v1.2) are still read by socialmixr,
    # but are an error (R08, variant legacy_boolean) with a message that names
    # the conversion. Text codes such as Y/N, T/F or yes/no are errors too,
    # because filters would silently match nothing. A column can add to
    # `legacy_values` (see phys_contact).
    values: ["TRUE", "FALSE"]
    legacy_values: ["0", "1"]
    # values that count as TRUE when checking location logic (R13)
    true_values: ["TRUE", "1"]
    description: "TRUE or FALSE (0/1 is not allowed)"
  integer:
    pattern: '^-?[0-9]+$'
    description: "Whole number"
  numeric:
    pattern: '^-?[0-9]+(\.[0-9]+)?([eE][-+]?[0-9]+)?$'
    description: "Number with '.' as decimal separator"
  # Household size: a count, an open-ended category such as 5+ (five or more)
  # or the word `nursing home` (institutional household).
  count_or_category:
    pattern: '^([0-9]+\+?|nursing home)$'
    description: "Whole number, an open-ended category such as 5+, or the text `nursing home`"
  id:
    pattern: '^[^\s,"]+$'
    description: "Identifier: string or integer, no whitespace or commas"
  code:
    pattern: '^[^\s,"]([^,"]*[^\s,"])?$'
    description: "Category code: string or integer"
  date_yyyymmdd:
    pattern: '^[0-9]{8}$'
    description: "Calendar date as YYYYMMDD, eight digits without separators (as in POLYMOD)"
  string:
    description: "Free text"

code_lists:
  iso3166_alpha2: [AD, AE, AF, AG, AI, AL, AM, AO, AQ, AR, AS, AT, AU, AW, AX,
    AZ, BA, BB, BD, BE, BF, BG, BH, BI, BJ, BL, BM, BN, BO, BQ, BR, BS, BT, BV,
    BW, BY, BZ, CA, CC, CD, CF, CG, CH, CI, CK, CL, CM, CN, CO, CR, CU, CV, CW,
    CX, CY, CZ, DE, DJ, DK, DM, DO, DZ, EC, EE, EG, EH, ER, ES, ET, FI, FJ, FK,
    FM, FO, FR, GA, GB, GD, GE, GF, GG, GH, GI, GL, GM, GN, GP, GQ, GR, GS, GT,
    GU, GW, GY, HK, HM, HN, HR, HT, HU, ID, IE, IL, IM, IN, IO, IQ, IR, IS, IT,
    JE, JM, JO, JP, KE, KG, KH, KI, KM, KN, KP, KR, KW, KY, KZ, LA, LB, LC, LI,
    LK, LR, LS, LT, LU, LV, LY, MA, MC, MD, ME, MF, MG, MH, MK, ML, MM, MN, MO,
    MP, MQ, MR, MS, MT, MU, MV, MW, MX, MY, MZ, NC, NE, NF, NG, NI, NL, "NO",
    NP, NR, NU, NZ, OM, PA, PE, PF, PG, PH, PK, PL, PM, PN, PR, PS, PT, PW, PY,
    QA, RE, RO, RS, RU, RW, SA, SB, SC, SD, SE, SG, SH, SI, SJ, SK, SL, SM, SN,
    SO, SR, SS, ST, SV, SX, SY, SZ, TC, TD, TF, TG, TH, TJ, TK, TL, TM, TN, TO,
    TR, TT, TV, TW, TZ, UA, UG, UM, US, UY, UZ, VA, VC, VE, VG, VI, VN, VU, WF,
    WS, YE, YT, ZA, ZM, ZW]

files:
  participant_common:
    suffix: "participant_common.csv"
    kind: common
    entity: participant
    required: true
    key: part_id
    description: "Participant-level information, one record per participant"
    columns:
      - name: part_id
        type: id
        nullable: false
        unique: true
        common_mistakes: [participant_id, partid, local_id, global_id]
        description: "Participant (diary) identifier; primary key"
      - name: hh_id
        type: id
        nullable: false   # A: hh_id never NA; hh_id = part_id if no household information
        common_mistakes: [household_id]
        description: "Household identifier; never NA (use hh_id = part_id if no household information was collected)"
      - name: part_age_exact
        type: integer
        nullable: true
        range: [0, 110]
        range_rule: R10
        aliases: [part_age]
        common_mistakes: [participant_age]
        description: "Exact age in completed years, whole number (0 for under one year); NA if not exact"
      - name: part_age_est_min
        type: integer
        nullable: true
        range: [0, 110]
        range_rule: R10
        description: "Lower bound of estimated age interval (inclusive); questionnaire category limit"
      - name: part_age_est_max
        type: integer
        nullable: true
        range: [0, 110]
        range_rule: R10
        description: "Upper bound of estimated age interval (exclusive; questionnaire category limit); NA for an open-ended category"
      - name: part_gender
        type: string
        nullable: true
        enum: [F, M, O]
        common_mistakes: [participant_gender, part_sex]
        description: "F, M or O (other); NA if not collected"
    foreign_keys:
      - column: hh_id
        references: hh_common.hh_id
        allow_na: false

  participant_extra:
    suffix: "participant_extra.csv"
    kind: extra
    entity: participant
    common: participant_common
    required: false
    description: "Survey-specific participant variables (panel_id goes here)"

  contact_common:
    suffix: "contact_common.csv"
    kind: common
    entity: contact
    required: true
    key: cnt_id
    description: "Contact-level information, one record per reported contact"
    columns:
      - name: part_id
        type: id
        nullable: false
        common_mistakes: [participant_id, local_id]
        description: "Participant identifier; foreign key to participant file"
      - name: cnt_id
        type: id
        nullable: false
        unique: true
        # Accepted legacy spelling (polymod, Flanders v1.2, CoMix). A record
        # must use one spelling in all its files (R40).
        aliases: [cont_id]
        common_mistakes: [contact_id]
        description: "Contact identifier; primary key; links common and extra"
      - name: cnt_gender
        type: string
        nullable: true
        enum: [F, M, O]
        common_mistakes: [cnt_sex]
        description: "Gender of the contact: F, M, O; NA if not collected"
      - name: cnt_age_exact
        type: integer
        nullable: true
        range: [0, 110]
        range_rule: R10
        description: "Exact age of the contact in completed years, whole number; NA if not exact"
      - name: cnt_age_est_min
        type: integer
        nullable: true
        range: [0, 110]
        range_rule: R10
        common_mistakes: [cnt_age_l]
        description: "Lower bound of estimated contact age (inclusive); questionnaire category limit"
      - name: cnt_age_est_max
        type: integer
        nullable: true
        range: [0, 110]
        range_rule: R10
        common_mistakes: [cnt_age_r]
        description: "Upper bound of estimated contact age (exclusive; questionnaire category limit); NA for an open-ended category"
      - name: cnt_home
        type: boolean
        nullable: true
        group: location
        description: "Contact at the participant's home"
      - name: cnt_work
        type: boolean
        nullable: true
        group: location
        description: "Contact at the participant's workplace"
      - name: cnt_school
        type: boolean
        nullable: true
        group: location
        description: "Contact at school"
      - name: cnt_transport
        type: boolean
        nullable: true
        group: location
        description: "Contact while using transport"
      - name: cnt_leisure
        type: boolean
        nullable: true
        group: location
        description: "Contact during a leisure activity"
      - name: cnt_otherplace
        type: boolean
        nullable: true
        group: location
        common_mistakes: [cnt_others, cnt_other]
        description: "Contact at any other location"
      - name: frequency_multi
        type: code
        nullable: true
        codes_in_dictionary: true
        recommended_codes: ["1", "2", "3", "4", "5"]
        common_mistakes: [cnt_frequency]
        description: "Frequency category (1 daily ... 5 first time; P10)"
      - name: duration_exact
        type: numeric
        nullable: true
        range: [0, 1440]
        description: "Exact duration in minutes"
      - name: duration_multi
        type: code
        nullable: true
        codes_in_dictionary: true
        recommended_codes: ["1", "2", "3", "4", "5"]
        common_mistakes: [cnt_duration]
        description: "Duration category (1 <5 min ... 5 >=4 h; P10)"
      - name: phys_contact
        type: boolean
        nullable: true
        common_mistakes: [cnt_touch]
        # legacy POLYMOD coding 1 = physical, 2 = not physical
        legacy_values: ["0", "1", "2"]
        description: "Physical contact (TRUE/FALSE)"
    # Columns of earlier drafts that are no longer part of the format. A
    # dataset that still has one gets a specific message (R05, variant retired).
    retired_columns:
      - name: cnt_age_multi
        note: "the age-class label duplicates `cnt_age_est_min` and `cnt_age_est_max` (the category limits) and is not used by socialmixr; remove it, and describe the categories in the dictionary instead"
    foreign_keys:
      - column: part_id
        references: participant_common.part_id
        allow_na: false

  contact_extra:
    suffix: "contact_extra.csv"
    kind: extra
    entity: contact
    common: contact_common
    required: false
    description: "Survey-specific contact variables"

  hh_common:
    suffix: "hh_common.csv"
    kind: common
    entity: household
    required: true
    key: hh_id
    description: "Household-level information, one record per household"
    columns:
      - name: hh_id
        type: id
        nullable: false
        unique: true
        common_mistakes: [household_id]
        description: "Household identifier; primary key"
      - name: country
        type: string
        nullable: false
        enum_ref: iso3166_alpha2
        # Namibia: alpha-2 `NA` is read as missing by much software, so the
        # alpha-3 code is used for it. A literal `NA` is never accepted.
        enum_extra: [NAM]
        # Required information. Text instead of a code (several countries, a
        # region) is a warning, never an error; `NA` is an error.
        enum_text_allowed: true
        na_hint: "country is required and never NA. Namibia is written NAM; for several countries or a region, write text (e.g. `multiple countries` or the region)"
        description: "ISO 3166-1 alpha-2 country code (NAM for Namibia); text if several countries or a region apply; never NA"
      - name: hh_size
        type: count_or_category
        nullable: true
        range: [1, 100]
        placeholder_values: ["99"]
        description: "Household size: a count, or a category written as 5+ (five or more) or nursing home; NA if not collected"

  hh_extra:
    suffix: "hh_extra.csv"
    kind: extra
    entity: household
    common: hh_common
    required: false
    description: "Survey-specific household variables"

  sday:
    suffix: "sday.csv"
    kind: common
    entity: sday
    required: true
    key: part_id
    description: "Survey-day information, one record per participant (P3)"
    columns:
      - name: part_id
        type: id
        nullable: false
        unique: true
        description: "Participant identifier; primary key"
      - name: sday_id
        type: date_yyyymmdd
        nullable: true
        description: "Date on which the diary or questionnaire was filled in, YYYYMMDD (e.g. 20110110); a value, not a key (P3, Q4 decided: fill-in date)"
      - name: day
        type: integer
        nullable: true
        range: [1, 31]
        description: "Calendar day of sday_id"
      - name: month
        type: integer
        nullable: true
        range: [1, 12]
        description: "Calendar month of sday_id"
      - name: year
        type: integer
        nullable: true
        range: [1900, 2100]
        description: "Four-digit calendar year of sday_id"
      - name: dayofweek
        type: integer
        nullable: true
        range: [0, 6]
        description: "Day of week derived from sday_id, 0 = Sunday ... 6 = Saturday; NA if sday_id is NA"
      - name: holiday
        type: boolean
        nullable: true
        required: false
        description: "Optional, recommended. TRUE if sday_id is a public holiday and/or a school holiday that applies to the participant's area, FALSE otherwise; NA if the date is unknown"
      - name: wave
        type: string
        nullable: true
        required: false
        description: "Optional, recommended for panel and repeated studies. Wave or round of the record (e.g. 1, 2, 3 or W1); one part_id is one person in one wave on one diary day. The dictionary says what a wave is"
    foreign_keys:
      - column: part_id
        references: participant_common.part_id
        allow_na: false

# Files that exist in a restricted record only. The checker flags them when
# found in a public folder (R27); validation of their content (R28-R33) is
# planned and meant to run locally.
restricted_files:
  geo_restricted:
    suffix: "geo_restricted.csv"
    description: "Optional restricted geography file (P24); never public"
    columns: [part_id, hh_id, zip_code, nis_code, municipality_name,
              latitude, longitude, geo_reference_year, geo_review_status]

dictionary:
  basename: "dictionary"
  required: true
  fields: [variable, description, type, values]

recommended_extra:
  contact_extra:
    - name: cnt_imputed
      type: boolean
      description: "TRUE if the contact is imputed or aggregated (P12)"
  participant_extra:
    - name: panel_id
      type: id
      description: "Same individual across survey rounds (optional)"

cross_column_rules:
  age_intervals:
    - table: participant_common
      exact: part_age_exact
      min: part_age_est_min
      max: part_age_est_max
    - table: contact_common
      exact: cnt_age_exact
      min: cnt_age_est_min
      max: cnt_age_est_max

record_hygiene:
  # Files that are not part of the guideline set but belong in a record.
  allowed_other_files: ["reference.json"]
  max_json_files: 1

silent_failure_columns: [cnt_home, cnt_work, cnt_school, cnt_transport,
  cnt_leisure, cnt_otherplace, phys_contact, dayofweek, part_gender, cnt_gender]

privacy:
  # Column-name tokens (lower case; names are split at non-alphanumerics).
  geography_tokens_strict: [zip, zipcode, postal, postalcode, postcode, plz,
    address, street, lat, latitude, lon, lng, longitude, xcoord, ycoord,
    coord, coords, coordinates]
  # Municipality-level tokens; also flagged (public files carry region and
  # province only, see Q20).
  geography_tokens_declared: [municipality, city, town, nis, gemeente, commune,
    postcode_name]
  # Direct identifiers: an error (R26 variant direct).
  identifier_tokens_direct: [firstname, lastname, surname, forename, email,
    phone, telephone, birthdate, birthday, dob, ssn, passport, iban]
  # Ambiguous tokens (`school_name` is a place, `dayofweek_name` a label): a
  # warning.
  identifier_tokens: [name]
  # Whole-file names (tokens) that mark a restricted geography file.
  restricted_file_tokens: [geo, zip, zipcode, postcode, restricted,
    coordinates, address]
  # Value-based heuristics for columns that are not in the schema.
  zip_like: {min: 1000, max: 9992, min_distinct: 30}
  coordinate_boxes:
    - {name: belgium, lat: [49.4, 51.6], lon: [2.4, 6.5]}

manual_items:
  - id: R25a
    title: "Kindergarten and daycare"
    prompt: "Locations beyond the six common ones (kindergarten, daycare, family visit) are mapped as documented (Q2) and kept in the contact extra file."
  - id: R25b
    title: "Age-interval bounds"
    prompt: "Age intervals use the documented bounds convention (inclusive or exclusive) in the dictionary (Q4/C4)."
  - id: R25c
    title: "Survey day"
    prompt: "sday_id is the date on which the diary or questionnaire was filled in (Q4 decided)."
  - id: R25d
    title: "Proxy respondents"
    prompt: "How proxy-reported participants and imputed contacts are coded is documented (Q5, P12)."
  - id: R25e
    title: "Holiday definition"
    when_column: sday.holiday
    prompt: "The definition of `holiday` (public and/or school holiday, region or community, calendar source) is documented in the dictionary."
  - id: R25f
    title: "Wave definition"
    when_column: sday.wave
    prompt: "The dictionary states what a wave is (fixed round of the same panel, repeated multi-day measurement, or recruitment batch) and how `wave` relates to `panel_id`."
  - id: R25g
    title: "Zenodo record content"
    prompt: "The Zenodo record follows the conventions of the guideline (creators as persons with family and given name, title, publication date, version, references, open files, Social Contact Data community), its description and geographic scope are consistent with the data files, and contactsurveys::get_citation() returns a correct citation."

decisions:
  # Choices of the guideline and where the schema encodes them (`where` shows
  # which key to edit). `status` is `decided` (settled on 2026-11-25, see the
  # `decision`) or `open`. Ids follow REVIEW_guidelines_vs_flanders2010.md;
  # `DATE` has no review id.
  - id: Q1
    status: open
    topic: "NAMETAG of surveys that share country and year (suffix rule; the two PLATO surveys)"
    decision: "Not decided; parked together with the Flanders data."
    where: "nametag.pattern"
  - id: Q27
    status: decided
    topic: "NAMETAG: NAME_YEAR[_SUFFIX]; which year; legacy prefix"
    decision: "NAME and YEAR are those of the earliest publication, or of the lead investigator and the start of data collection if there is none yet; fixed at creation. The form is a recommendation (revised 2026-11-25): a name that deviates, including the year-first legacy prefix, is a note (R02 not_recommended, legacy_prefix); only a name that is not ASCII letters, digits, underscore or hyphen is an error. The same prefix on every file stays a hard rule (R01)."
    where: "nametag.pattern; nametag.valid_pattern; nametag.legacy_pattern; rules.R02.severities"
  - id: Q2
    status: decided
    topic: "Kindergarten and daycare map to cnt_school (manual item R25a)"
    decision: "Kindergarten sets cnt_school."
    where: "manual_items[R25a]; rules.R13"
  - id: Q3
    status: decided
    topic: "Is hh_id required (individual surveys)?"
    decision: "hh_id is never NA; without household information use hh_id = part_id. The table layout is unchanged (country stays in the household file)."
    where: "files.participant_common.columns[hh_id].nullable"
  - id: Q4
    status: decided
    topic: "What is sday_id; weekday check severity"
    decision: "sday_id is the date on which the diary or questionnaire was filled in; dayofweek is derived from it. No assigned-day column. The weekday check stays a warning."
    where: "rules.R12.severities.weekday"
  - id: DATE
    status: decided
    topic: "Date format"
    decision: "sday_id is written as YYYYMMDD (eight digits, no separators), in line with POLYMOD; NA if missing. ISO YYYY-MM-DD and dotted dates are errors. Changed on 2026-11-25 from ISO YYYY-MM-DD: 16 of 26 non-CoMix Zenodo records already use YYYYMMDD."
    where: "types.date_yyyymmdd; rules.R12"
  - id: Q6
    status: decided
    topic: "Boolean coding (strict TRUE/FALSE) and missing tokens"
    decision: "TRUE/FALSE only; NA is the only missing token."
    where: "types.boolean.values; options.missing_token_aliases"
  - id: Q41
    status: decided
    topic: "Contact ID: cnt_id canonical, cont_id legacy alias (R40)"
    decision: "cnt_id is canonical; cont_id is read as a legacy alias."
    where: "files.contact_common.columns[cnt_id].aliases; files.contact_common.key"
  - id: Q31
    status: decided
    topic: "Optional columns (age interval, duration_exact)"
    decision: "All common columns are mandatory (a uniformity rule for the checker, not a socialmixr requirement); only holiday is optional (recommended)."
    where: "files.<id>.columns[].required"
  - id: Q52
    status: decided
    topic: "cnt_age_multi dropped from the contact file"
    decision: "cnt_age_multi is removed: it only labels the category limits that cnt_age_est_min and cnt_age_est_max already hold, and socialmixr does not use it. In the three test datasets that have it (LOEDY, TSUZUKI, SON) it is either a label of exactly those two columns or entirely NA. A dataset that still carries it gets a specific R05 message."
    where: "files.contact_common.retired_columns"
  - id: Q53
    status: decided
    topic: "Dictionary layout: header in row 1, fixed column names, type list, code = label"
    decision: "One sheet per data file named like the file suffix; header variable | description | type | values in row 1 (notes on an INDEX or README sheet); types integer, numeric, string, boolean, date, code; values as `code = label`; dayofweek 0 = Sunday ... 6 = Saturday. The checker still reads other layouts and reports them as a note (R15 variants layout and type_word)."
    where: "dictionary.fields; rules.R15.severities"
  - id: Q54
    status: decided
    topic: "hh_size may be categorical (5+, nursing home)"
    decision: "hh_size is a whole number, an open-ended category written N+ (e.g. 5+), or the text `nursing home`; other text is an error (R08). Categories are skipped by the range, R19 and R42 checks, which apply to the numeric values. The dictionary type is integer for counts and string when categories are used."
    where: "types.count_or_category; files.hh_common.columns[hh_size]"
  - id: Q32
    status: decided
    topic: "Boolean coding: TRUE/FALSE required, 0/1 is an error (Q32)"
    decision: "As Q6; 0/1 is not allowed and an error (revised 2026-11-25; was a legacy warning). Published records that use 0/1 fail R08 until they are converted."
    where: "types.boolean.values; types.boolean.legacy_values; rules.R08.severities.legacy_boolean"
  - id: Q34
    status: decided
    topic: "Age rules: whole numbers, interval bounds, open age bands"
    decision: "Ages and bounds are whole numbers of completed years (0 for under one year). Lower bound inclusive, upper bound exclusive, stored as the questionnaire category limits; open-ended bands have NA as upper bound (accepted)."
    where: "options.allow_open_age_interval; files.participant_common.columns[part_age_*]"
  - id: P11
    status: decided
    topic: "Participant age column names"
    decision: "part_age_exact, part_age_est_min, part_age_est_max (legacy alias part_age)."
    where: "files.participant_common.columns[part_age_exact].aliases"
  - id: P42
    status: decided
    topic: "holiday column in the survey-day file"
    decision: "Optional but recommended: TRUE if the day is a public and/or school holiday that applies to the participant's area; the dictionary states calendars and dates."
    where: "files.sday.columns[holiday].required"
  - id: T1
    status: decided
    topic: "wave column (test datasets, 25 Nov 2026)"
    decision: "Optional, recommended column wave in the survey-day file (sday), not in the participant extra file; one part_id is one person in one wave on one diary day; the dictionary defines the wave. Checker built; guideline text (main.tex) not yet updated."
    where: "files.sday.columns[wave].required; manual item R25f"
  - id: Q14
    status: decided
    topic: "Severity policy and column order"
    decision: "Errors stop socialmixr or break keys; warnings are recommended conventions and plausibility; notes are style. Column order is not enforced."
    where: "rules.<id>.severity; options.column_order"
  - id: Q16
    status: decided
    topic: "Dictionary format (xlsx and/or long CSV)"
    decision: ".xlsx/.xls following the Zenodo template in the public record; .csv only locally. Enforced (25 Nov 2026): a .csv dictionary is an R01 error (it is still read so the dictionary checks run). Other formats that are both human and machine readable can be considered in a future version."
    where: "options.dictionary_extensions"
  - id: Q20
    status: decided
    topic: "Public geography file NAMETAG_participants_city.csv"
    decision: "Optional; part_region and part_province only. Municipality, NIS, ZIP and coordinates only in a restricted twin outside the record. Not yet encoded in the schema or the checker."
    where: "(not yet encoded)"
  - id: Q39
    status: open
    topic: "Sharded file names NAMETAG_participant_common_<part>.csv"
    decision: "Not decided."
    where: "(not yet encoded)"
  - id: Q51
    status: decided
    topic: "Study metadata file NAMETAG_metadata.yaml"
    decision: "Dropped on 2026-11-25: no metadata file is required and rule R24 is removed. Study information stays in the Zenodo record and the dictionary; R25g checks that the Zenodo title, description, dates and geographic scope match the data files. R27 no longer has a declared geography level: municipality, city and NIS columns are always flagged."
    where: "(rule R24, `metadata` block and `geography_declared_levels` removed)"
  - id: Q40
    status: open
    topic: "Zenodo metadata strictness (version string, References)"
    decision: "Conventions written down 2026-11-25 in main.tex (section on the Zenodo record), in line with what contactsurveys::get_citation() and download_survey() read: creators as persons with family and given name, title, publication date, version, references, open files, community. Automatic check (R36) still planned."
    where: "(R25g manual item; R36 planned)"
  - id: COUNTRY
    status: decided
    topic: "Country column: required, never NA; text for several countries or a region"
    decision: "Decided 2026-11-25: country is required. ISO alpha-2 (NAM for Namibia); a literal NA is an error; several countries or a region are written as text (warning R09 variant text), described in the dictionary."
    where: "files.hh_common.columns[country]; rules.R09.severities.text"
  - id: PRIVACY
    status: decided
    topic: "Personal information in column names"
    decision: "Checked 2026-11-25: direct identifiers (first/last name, e-mail, phone, birth date, ssn, passport, iban) are an error (R26 variant direct); the token name alone stays a warning (school_name, dayofweek_name); geography columns are an error (R27), value-based ZIP/coordinate guesses in other columns a warning."
    where: "privacy.identifier_tokens_direct; privacy.identifier_tokens; rules.R26.severities.direct"

rules:
  - id: R01
    class: A
    severity: error
    severities: {unrecognised: warning}
    title: "Required files present and named NAMETAG_<name>; one participant_common and one contact_common file; dictionary is .xlsx/.xls; no CSV with another prefix"
    ref: "main.tex sec. 2.1, 3, 4"
  - id: R02
    class: A
    severity: error
    severities: {legacy_prefix: note, not_recommended: note}
    title: "NAMETAG: recommended form NAME_YEAR[_SUFFIX]; error only if unusable as a file name prefix"
    ref: "main.tex sec. 2.1"
  - id: R04
    class: A
    severity: error
    title: "CSV format: UTF-8, comma, header, no row names, no empty cells"
    ref: "main.tex sec. 2.1, 2.3"
  - id: R05
    class: A
    severity: error
    severities: {order: error, extra: error, misplaced: error, misspelled: error, retired: error, alias: note}
    title: "Common files hold the required columns (optional ones may be absent), no others"
    ref: "main.tex sec. 4"
  - id: R06
    class: X
    severity: error
    severities: {shared: warning}
    title: "Extra files: same key set as common, no duplicated columns"
    ref: "main.tex sec. 3"
  - id: R07
    class: A
    severity: error
    severities: {placeholder: warning}
    title: "Missing values only as NA, no placeholder codes"
    ref: "main.tex sec. 2.3"
  - id: R08
    class: A
    severity: error
    severities: {legacy_boolean: error}
    title: "Column types (integer, numeric, string, boolean TRUE/FALSE)"
    ref: "main.tex sec. 4"
  - id: R09
    class: A
    severity: error
    severities: {text: warning}
    title: "Enumerations and value ranges (a descriptive text in country is a warning)"
    ref: "main.tex sec. 4"
  - id: R10
    class: A
    severity: error
    severities: {empty_interval: warning}
    title: "Age rules: exact xor interval, min < max (upper bound exclusive), 0-110"
    ref: "main.tex sec. 4.1, 4.2"
  - id: R11
    class: H
    severity: warning
    title: "Age plausibility (share of missing ages)"
    ref: "REVIEW D6"
  - id: R12
    class: A
    severity: error
    severities: {weekday: warning}
    title: "Survey day: valid YYYYMMDD, day/month/year match, weekday"
    ref: "main.tex sec. 4.4"
  - id: R13
    class: A
    severity: error
    title: "Location logic: a contact has at least one TRUE location or all NA"
    ref: "main.tex sec. 4.2, P9"
  - id: R14
    class: X
    severity: error
    severities: {scheme: note}
    title: "Category codes are covered by the dictionary"
    ref: "main.tex sec. 4.2, P10"
  - id: R15
    class: X
    severity: error
    severities: {phantom: warning, type: warning, layout: note, type_word: note, skipped: note}
    title: "Dictionary documents every column with required fields"
    ref: "main.tex sec. 4.5"
  - id: R16
    class: A
    severity: error
    title: "Key uniqueness and non-missing keys"
    ref: "main.tex sec. 2.2, 3"
  - id: R17
    class: X
    severity: error
    title: "Foreign-key integrity across files"
    ref: "main.tex sec. 3"
  - id: R18
    class: X
    severity: error
    severities: {zero_contacts: note}
    title: "Every participant has a survey-day row; zero-contact participants kept"
    ref: "REVIEW B6, P7"
  - id: R19
    class: X
    severity: warning
    title: "Household size is not smaller than participants per household"
    ref: "REVIEW 4.5"
  - id: R20
    class: X
    severity: warning
    severities: {summary: note}
    title: "Panel ids: one individual, distinct part_id per wave"
    ref: "main.tex sec. 5"
  - id: R41
    class: X
    severity: error
    title: "A part_id belongs to one panel_id only, in every file that carries it"
    ref: "main.tex sec. 5"
  - id: R42
    class: H
    severity: warning
    title: "Household size is plausible (not above max_plausible_hh_size)"
    ref: "other_code/validate_socrates.R comparison, 25 Nov 2026"
  - id: R43
    class: H
    severity: note
    severities: {location: warning}
    title: "Columns that are entirely NA (a whole location group NA is a warning)"
    ref: "test datasets, 25 Nov 2026"
  - id: R44
    class: H
    severity: warning
    title: "Share of participants without a survey date (sday_id = NA)"
    ref: "test datasets, 25 Nov 2026"
  - id: R45
    class: X
    severity: warning
    severities: {age: warning}
    title: "Panel ids: same individual keeps gender and a plausible age over time"
    ref: "test datasets, 25 Nov 2026"
  - id: R21
    class: H
    severity: warning
    severities: {imputed: note}
    title: "Contact count plausibility"
    ref: "REVIEW D6"
  - id: R22
    class: A
    severity: error
    severities: {skipped: note}
    title: "socialmixr smoke test (load_survey, contact_matrix)"
    ref: "REVIEW 6"
  - id: R23
    class: A
    severity: warning
    title: "Imputation or aggregation is flagged"
    ref: "REVIEW F3, P12"
  - id: R25
    class: M
    severity: manual
    title: "Convention-dependent decisions are documented"
    ref: "REVIEW Q2, Q4, Q5"
  - id: R26
    class: H
    severity: warning
    severities: {direct: error}
    title: "No personal identifiers among column names (direct identifiers: error; `name`: warning)"
    ref: "REVIEW 6.6"
  - id: R27
    class: A
    severity: error
    severities: {coords_values: warning, zip_values: warning}
    title: "Privacy scan: no ZIP, address or coordinates in the public record"
    ref: "REVIEW P23"
  - id: R34
    class: X
    severity: error
    title: "Record hygiene: no CSV that socialmixr would merge unintentionally, at most one JSON"
    ref: "REVIEW P30, P31"
  - id: R35
    class: A
    severity: error
    severities: {skipped: note, dictionary_csv: note}
    title: "Merge simulation: socialmixr load keeps row counts, no merge warnings"
    ref: "REVIEW P30"
  - id: R36
    class: A
    severity: error
    planned: true
    title: "Zenodo record metadata (needs network; contactsurveys)"
    ref: "REVIEW P32, P38"
  - id: R37
    class: A
    severity: error
    planned: true
    title: "Silent-failure columns exist under exact names (currently covered by R05)"
    ref: "REVIEW P35, P37"
  - id: R40
    class: X
    severity: error
    title: "One spelling of the contact ID (cnt_id or legacy cont_id) per record"
    ref: "REVIEW 6A.2a"
  - id: R38
    class: X
    severity: error
    title: "Identifier type is the same in every file (integer or string)"
    ref: "REVIEW 6A T5"
  - id: R39
    class: A
    severity: error
    title: "Silent-wrong-result values beyond R08-R10 (diary_weight numeric, no NA)"
    ref: "REVIEW 6A"
  - id: R28
    class: X
    severity: error
    planned: true
    title: "Restricted geography file: one row per part_id, keys match"
    ref: "REVIEW P24"
  - id: R29
    class: A
    severity: error
    planned: true
    title: "ZIP format (BE: four digits, 1000-9992, string)"
    ref: "REVIEW P24"
  - id: R30
    class: X
    severity: error
    planned: true
    title: "ZIP and municipality consistent with the reference list"
    ref: "REVIEW P26"
  - id: R31
    class: X
    severity: warning
    planned: true
    title: "Household members share ZIP/municipality"
    ref: "REVIEW F13"
  - id: R32
    class: X
    severity: error
    planned: true
    title: "No unreviewed geography status left"
    ref: "REVIEW P27"
  - id: R33
    class: X
    severity: warning
    planned: true
    title: "Geography consistent with declared region"
    ref: "REVIEW P25"
